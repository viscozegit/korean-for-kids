<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>한글 떼기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 따뜻한 파스텔 팔레트 */
  --bg-1: #FFF6E0;
  --bg-2: #FFE3DB;
  --card: #ffffff;
  --primary: #FFB42B;
  --primary-deep: #F97316;
  --pink: #FF8FA3;
  --mint: #6DD3B0;
  --sky: #7AC7F0;
  --lavender: #B19CD9;
  --good: #5BCE7E;
  --text: #4A3A2A;
  --muted: #9a8a78;
  --soft: #FFE89A;
  --gray: #E5D5B7;

  /* 폰트 */
  --font-ui: 'Jua', -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-cute: 'Gaegu', 'Jua', sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  font-family: var(--font-ui);
  background:
    radial-gradient(circle at 15% 15%, #FFE0F0 0, transparent 30%),
    radial-gradient(circle at 85% 85%, #DDF1FA 0, transparent 30%),
    radial-gradient(circle at 50% 50%, #FFFBE8 0, transparent 40%),
    linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
  color: var(--text);
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  height: 100vh;
  overflow: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

#app {
  height: 100vh; width: 100vw;
  display: flex; flex-direction: column;
  position: relative;
}

/* ============ 공통 ============ */
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 4px 16px;
  flex-shrink: 0;
}

.back-btn, .home-btn {
  font-size: 28px;
  padding: 10px 14px;
  min-width: 60px;
  min-height: 60px;
  border-radius: 50%;
  background: white;
  color: var(--text);
  box-shadow: 0 6px 0 rgba(0,0,0,0.08);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.back-btn:active, .home-btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 rgba(0,0,0,0.08);
}

.stars-display {
  font-size: 24px;
  padding: 10px 18px;
  border-radius: 999px;
  background: white;
  box-shadow: 0 6px 0 rgba(0,0,0,0.08);
}

/* ============ 홈 ============ */
.home-greet {
  text-align: center;
  font-size: 34px;
  margin: 12px 0 24px;
  color: var(--primary-deep);
  text-shadow: 3px 3px 0 rgba(255,180,43,0.25);
}

.home-cards {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 22px;
  max-width: 700px;
  width: 100%;
  margin: 0 auto;
  padding-bottom: 16px;
}
@media (orientation: landscape) and (min-width: 700px) {
  .home-cards { flex-direction: row; }
}

.home-card {
  flex: 1;
  border-radius: 36px;
  padding: 28px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 220px;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
}
.home-card:nth-child(1) {
  background: linear-gradient(135deg, #FFF1A8 0%, #FFD86B 100%);
  box-shadow: 0 8px 0 #E5A91A, 0 14px 32px rgba(0,0,0,0.08);
  transform: rotate(-1.5deg);
}
.home-card:nth-child(2) {
  background: linear-gradient(135deg, #FFD5DC 0%, #FF9DB1 100%);
  box-shadow: 0 8px 0 #D86A82, 0 14px 32px rgba(0,0,0,0.08);
  transform: rotate(1.5deg);
}
.home-card:active {
  transform: translateY(5px) rotate(0deg);
  box-shadow: 0 3px 0 rgba(0,0,0,0.15), 0 6px 12px rgba(0,0,0,0.06);
}
.home-card.disabled {
  opacity: 0.55;
  filter: saturate(0.4);
}
.home-card-emoji {
  font-size: 96px;
  line-height: 1;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.12));
  animation: floaty 3s ease-in-out infinite alternate;
}
.home-card:nth-child(2) .home-card-emoji { animation-delay: -1.5s; }
@keyframes floaty {
  from { transform: translateY(0) rotate(-3deg); }
  to { transform: translateY(-8px) rotate(3deg); }
}
.home-card-title {
  font-size: 36px;
  margin-top: 16px;
  color: var(--text);
}
.home-card-sub {
  font-size: 20px;
  color: var(--muted);
  margin-top: 6px;
  font-family: var(--font-cute);
  font-weight: 700;
}
.continue-btn {
  margin: 16px auto 0;
  background: var(--primary-deep);
  color: white;
  font-size: 22px;
  padding: 16px 30px;
  border-radius: 999px;
  box-shadow: 0 6px 0 #c45e16;
  transition: transform 0.1s, box-shadow 0.1s;
}
.continue-btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #c45e16;
}

/* ============ 그리드 ============ */
.grid-title {
  text-align: center;
  font-size: 30px;
  margin: 0 0 22px;
  color: var(--primary-deep);
  text-shadow: 2px 2px 0 rgba(255,180,43,0.2);
}

.letter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
  padding: 8px;
}
@media (min-width: 600px) {
  .letter-grid { grid-template-columns: repeat(5, 1fr); }
}
@media (min-width: 900px) {
  .letter-grid { grid-template-columns: repeat(7, 1fr); }
}

.letter-card {
  border-radius: 24px;
  padding: 14px 8px 10px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 124px;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
}
/* 6색 파스텔 로테이션 — 스티커북 느낌 */
.letter-card:nth-child(6n+1) { background: #FFF1B8; box-shadow: 0 5px 0 #E5C961; transform: rotate(-2deg); }
.letter-card:nth-child(6n+2) { background: #C8F0E1; box-shadow: 0 5px 0 #82CDB0; transform: rotate(1.5deg); }
.letter-card:nth-child(6n+3) { background: #C8E6FF; box-shadow: 0 5px 0 #7AB6E8; transform: rotate(-1.5deg); }
.letter-card:nth-child(6n+4) { background: #FFD1D6; box-shadow: 0 5px 0 #E89AA3; transform: rotate(2deg); }
.letter-card:nth-child(6n+5) { background: #E1D5FF; box-shadow: 0 5px 0 #A693D6; transform: rotate(-1deg); }
.letter-card:nth-child(6n+6) { background: #FFD9B5; box-shadow: 0 5px 0 #E8AB78; transform: rotate(1deg); }

.letter-card:active {
  transform: translateY(4px) rotate(0deg);
  box-shadow: 0 1px 0 rgba(0,0,0,0.1);
}
.letter-card.complete {
  background: linear-gradient(135deg, #DAF5E0 0%, #A8E5BC 100%) !important;
  box-shadow: 0 5px 0 var(--good) !important;
}
.letter-card.complete::before {
  content: '⭐';
  position: absolute;
  top: -10px;
  right: -8px;
  font-size: 24px;
  animation: twinkle 1.6s ease-in-out infinite alternate;
}
.letter-card-letter {
  font-size: 44px;
  line-height: 1;
  color: var(--text);
}
.letter-card-emoji { font-size: 26px; margin-top: 6px; }
.letter-card-stars {
  font-size: 14px;
  letter-spacing: 1px;
  margin-top: 4px;
  min-height: 18px;
}

/* ============ 학습 공통 ============ */
.progress-dots {
  display: flex;
  gap: 10px;
  align-items: center;
}
.progress-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: white;
  box-shadow: inset 0 2px 0 rgba(0,0,0,0.08);
}
.progress-dot.active {
  background: var(--primary-deep);
  transform: scale(1.3);
  box-shadow: 0 3px 0 #c45e16;
}
.progress-dot.done {
  background: var(--good);
  box-shadow: 0 3px 0 #3e9d5b;
}

/* ============ 1단계: 보고 듣기 ============ */
.recognize-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-around;
  padding: 12px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
  gap: 12px;
}
.big-letter {
  font-size: clamp(180px, 44vmin, 320px);
  line-height: 0.9;
  color: var(--text);
  background: white;
  border-radius: 40px;
  padding: 28px 56px;
  box-shadow: 0 10px 0 rgba(0,0,0,0.08), 0 16px 40px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  transform: rotate(-1deg);
}
.big-letter::before {
  content: '✨';
  position: absolute;
  top: -14px;
  right: -8px;
  font-size: 36px;
  animation: twinkle 1.6s ease-in-out infinite alternate;
}
.big-letter::after {
  content: '⭐';
  position: absolute;
  bottom: -10px;
  left: -8px;
  font-size: 26px;
  animation: twinkle 1.6s ease-in-out -0.8s infinite alternate;
}
@keyframes twinkle {
  from { transform: scale(0.9) rotate(-10deg); opacity: 0.7; }
  to   { transform: scale(1.15) rotate(15deg); opacity: 1; }
}
.big-letter:active {
  transform: translateY(5px) rotate(0deg);
  box-shadow: 0 4px 0 rgba(0,0,0,0.08);
}

.letter-pronounce {
  font-size: 34px;
  color: var(--primary-deep);
  text-shadow: 2px 2px 0 rgba(255,180,43,0.25);
}
.assoc {
  display: flex;
  align-items: center;
  gap: 16px;
  background: linear-gradient(135deg, #FFF1B8 0%, #FFE089 100%);
  border-radius: 28px;
  padding: 14px 26px;
  font-size: 28px;
  box-shadow: 0 6px 0 #E5C961;
  cursor: pointer;
  transform: rotate(1deg);
  transition: transform 0.15s, box-shadow 0.15s;
}
.assoc:active {
  transform: translateY(4px) rotate(0deg);
  box-shadow: 0 2px 0 #E5C961;
}
.assoc-emoji { font-size: 48px; }

.next-btn, .replay-btn {
  font-size: 22px;
  padding: 16px 28px;
  border-radius: 999px;
  min-height: 60px;
  transition: transform 0.1s, box-shadow 0.1s;
}
.next-btn {
  background: var(--primary-deep);
  color: white;
  box-shadow: 0 6px 0 #c45e16;
}
.next-btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #c45e16;
}
.replay-btn {
  background: var(--soft);
  color: var(--text);
  box-shadow: 0 6px 0 #d4a800;
}
.replay-btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #d4a800;
}
.row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

/* ============ 2단계: 따라쓰기 ============ */
.trace-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 8px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
}
.trace-hint {
  font-size: 22px;
  color: var(--muted);
  text-align: center;
  font-family: var(--font-cute);
  font-weight: 700;
}
.trace-status {
  font-size: 24px;
  text-align: center;
  min-height: 32px;
  color: var(--good);
}
.trace-status.pending { color: var(--muted); }
.canvas-wrap {
  position: relative;
  width: min(85vw, 60vh, 480px);
  aspect-ratio: 1 / 1;
  background: #FFFBEB;
  border: 4px dashed var(--primary);
  border-radius: 32px;
  overflow: hidden;
  touch-action: none;
  box-shadow: 0 8px 0 rgba(0,0,0,0.06);
}
.canvas-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.canvas-wrap #guide-canvas { z-index: 1; }
.canvas-wrap #user-canvas { z-index: 2; }
.canvas-wrap, .canvas-wrap * { touch-action: none !important; }

/* ============ 3단계: 퀴즈 ============ */
.quiz-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 12px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
}
.quiz-prompt {
  font-size: 28px;
  text-align: center;
}
.quiz-prompt b {
  font-size: 42px;
  color: var(--primary-deep);
  text-shadow: 2px 2px 0 rgba(255,180,43,0.25);
}
.quiz-options {
  display: flex;
  gap: 18px;
  justify-content: center;
  flex-wrap: wrap;
}
.quiz-option {
  border-radius: 28px;
  padding: 24px 8px;
  width: clamp(110px, 28vw, 150px);
  height: clamp(110px, 28vw, 150px);
  font-size: clamp(64px, 16vw, 96px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s, box-shadow 0.1s;
  border: 4px solid transparent;
  color: var(--text);
}
.quiz-option:nth-child(1) { background: #FFF1B8; box-shadow: 0 6px 0 #E5C961; transform: rotate(-1.5deg); }
.quiz-option:nth-child(2) { background: #C8F0E1; box-shadow: 0 6px 0 #82CDB0; transform: rotate(1.5deg); }
.quiz-option:nth-child(3) { background: #C8E6FF; box-shadow: 0 6px 0 #7AB6E8; transform: rotate(-1deg); }
.quiz-option:active {
  transform: translateY(4px) rotate(0deg);
  box-shadow: 0 2px 0 rgba(0,0,0,0.1);
}
.quiz-option.wrong {
  animation: shake 0.4s;
  border-color: #F87171;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-10px) rotate(-5deg); }
  75% { transform: translateX(10px) rotate(5deg); }
}

/* ============ 보상 ============ */
.reward-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 16px;
  text-align: center;
}
.reward-title {
  font-size: 42px;
  color: var(--primary-deep);
  text-shadow: 3px 3px 0 rgba(255,180,43,0.3);
  animation: bouncyIn 0.6s ease-out;
}
@keyframes bouncyIn {
  0% { transform: scale(0) rotate(-30deg); opacity: 0; }
  60% { transform: scale(1.25) rotate(8deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}
.reward-stars {
  font-size: 88px;
  letter-spacing: 12px;
  animation: pop 0.8s ease-out;
}
@keyframes pop {
  0% { transform: scale(0) rotate(-30deg); opacity: 0; }
  60% { transform: scale(1.3) rotate(15deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}
.reward-letter-card {
  background: linear-gradient(135deg, #FFF1A8 0%, #FFD86B 100%);
  border-radius: 32px;
  padding: 24px 36px;
  box-shadow: 0 8px 0 #E5A91A;
  display: flex;
  align-items: center;
  gap: 22px;
  transform: rotate(-2deg);
}
.reward-letter-card .L { font-size: 96px; line-height: 1; color: var(--text); }
.reward-letter-card .W { font-size: 28px; }
.reward-letter-card .E { font-size: 64px; line-height: 1; }

/* ============ 단계 진행도 (홈) ============ */
.stage-progress {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 0 0 22px;
}
.s-dot {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  font-family: var(--font-ui);
}
.s-done { background: var(--good); color: white; box-shadow: 0 3px 0 #3e9d5b; }
.s-now {
  background: var(--primary-deep); color: white;
  box-shadow: 0 3px 0 #c45e16;
  transform: scale(1.15);
  animation: bounce 1.4s ease-in-out infinite;
}
.s-todo { background: white; color: var(--muted); box-shadow: 0 3px 0 rgba(0,0,0,0.08); }
@keyframes bounce {
  0%, 100% { transform: scale(1.15) translateY(0); }
  50% { transform: scale(1.15) translateY(-4px); }
}

/* ============ 오늘의 학습 카드 ============ */
.today-card {
  display: block;
  max-width: 520px;
  width: 92%;
  margin: 0 auto 16px;
  padding: 36px 28px;
  border-radius: 36px;
  background: linear-gradient(135deg, #FFF1A8 0%, #FFB42B 100%);
  box-shadow: 0 10px 0 #E5A91A, 0 16px 36px rgba(0,0,0,0.1);
  text-align: center;
  transform: rotate(-1deg);
  transition: transform 0.15s, box-shadow 0.15s;
}
.today-card:active {
  transform: translateY(6px) rotate(0deg);
  box-shadow: 0 4px 0 #E5A91A;
}
.today-card.today-done {
  background: linear-gradient(135deg, #DAF5E0 0%, #5BCE7E 100%);
  box-shadow: 0 10px 0 #3e9d5b, 0 16px 36px rgba(0,0,0,0.1);
}
.today-emoji {
  font-size: 80px;
  line-height: 1;
  animation: floaty 3s ease-in-out infinite alternate;
}
.today-stage-label {
  display: inline-block;
  background: white;
  color: var(--primary-deep);
  padding: 6px 18px;
  border-radius: 999px;
  font-size: 22px;
  margin-top: 10px;
  box-shadow: 0 3px 0 rgba(0,0,0,0.1);
}
.today-title {
  font-size: 32px;
  margin-top: 14px;
  color: var(--text);
}
.today-sub {
  font-size: 28px;
  margin-top: 8px;
  color: var(--text);
  letter-spacing: 6px;
}

/* ============ 단계 인트로 ============ */
.stage-intro {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 16px;
  text-align: center;
}
.stage-intro-num {
  background: var(--primary-deep);
  color: white;
  font-size: 42px;
  padding: 14px 36px;
  border-radius: 999px;
  box-shadow: 0 8px 0 #c45e16;
  animation: bouncyIn 0.6s ease-out;
}
.stage-intro-title {
  font-size: 28px;
  color: var(--muted);
}
.stage-intro-letters {
  font-size: clamp(72px, 18vw, 130px);
  line-height: 1;
  color: var(--text);
  background: white;
  border-radius: 36px;
  padding: 18px 36px;
  box-shadow: 0 10px 0 rgba(0,0,0,0.08), 0 16px 32px rgba(0,0,0,0.08);
  letter-spacing: 8px;
  transform: rotate(-1deg);
}
.stage-intro-emojis {
  font-size: 48px;
  letter-spacing: 10px;
}
.big-start-btn {
  background: var(--primary-deep);
  color: white;
  font-size: 28px;
  padding: 22px 48px;
  border-radius: 999px;
  box-shadow: 0 8px 0 #c45e16;
  transition: transform 0.1s, box-shadow 0.1s;
  margin-top: 8px;
}
.big-start-btn:active {
  transform: translateY(6px);
  box-shadow: 0 2px 0 #c45e16;
}

/* ============ 단계 진행 바 (학습 화면 상단) ============ */
.stage-bar {
  flex: 1;
  height: 18px;
  background: white;
  border-radius: 999px;
  position: relative;
  margin: 0 14px;
  box-shadow: inset 0 2px 0 rgba(0,0,0,0.08);
  overflow: hidden;
}
.stage-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary) 0%, var(--primary-deep) 100%);
  border-radius: 999px;
  transition: width 0.3s;
}
.stage-bar-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--text);
  font-family: var(--font-ui);
}

/* ============ 복습 배지 ============ */
.review-badge {
  background: var(--sky);
  color: white;
  font-size: 22px;
  padding: 8px 22px;
  border-radius: 999px;
  box-shadow: 0 4px 0 #5DA3D0;
  transform: rotate(-2deg);
}

/* ============ 단계 완료 화면 ============ */
.stage-done-letters {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}
.stage-done-card {
  background: white;

function getLetterData(letter) {
  return CONSONANTS.find(c => c.letter === letter)
      || VOWELS.find(v => v.letter === letter);
}

function letterSet(letter) {
  return VOWELS.some(v => v.letter === letter) ? VOWELS : CONSONANTS;
}

function letterType(letter) {
  return VOWELS.some(v => v.letter === letter) ? 'vowel' : 'consonant';
}

// ===================================================================
// 커리큘럼: 10단계
// ===================================================================
const CURRICULUM = [
  { num: 1,  newLetters: ['ㅇ', 'ㅣ', 'ㅡ'] },
  { num: 2,  newLetters: ['ㄱ', 'ㅏ'] },
  { num: 3,  newLetters: ['ㄴ', 'ㅗ'] },
  { num: 4,  newLetters: ['ㄷ', 'ㅓ'] },
  { num: 5,  newLetters: ['ㅁ', 'ㅜ'] },
  { num: 6,  newLetters: ['ㅂ', 'ㅑ'] },
  { num: 7,  newLetters: ['ㅅ', 'ㅕ'] },
  { num: 8,  newLetters: ['ㅎ', 'ㅛ'] },
  { num: 9,  newLetters: ['ㄹ', 'ㅠ', 'ㅈ'] },
  { num: 10, newLetters: ['ㅊ', 'ㅋ', 'ㅌ', 'ㅍ'] }
];
const TOTAL_STAGES = CURRICULUM.length;

function stageData(num) { return CURRICULUM[num - 1]; }

function previousLetters(stageNum) {
  return CURRICULUM.slice(0, stageNum - 1).flatMap(s => s.newLetters);
}

// 단계의 활동 목록 빌드 (배운 글자들 복습 섞어서)
function buildStageActivities(stageNum) {
  const stage = stageData(stageNum);
  if (!stage) return [];
  const prev = previousLetters(stageNum);
  const reviewPool = shuffle([...prev]);
  let reviewCursor = 0;
  const acts = [];

  stage.newLetters.forEach(letter => {
    // 새 순서: 먼저 따라쓰기 → 발음 → 퀴즈
    acts.push({ type: 'trace', letter });
    acts.push({ type: 'recognize', letter });
    acts.push({ type: 'quiz', letter });
    // 새 글자 직후 이전 글자 복습 2개 (있다면)
    if (reviewPool.length > 0) {
      for (let i = 0; i < 2 && reviewPool.length > 0; i++) {
        const rl = reviewPool[(reviewCursor++) % reviewPool.length];
        acts.push({ type: 'review', letter: rl });
      }
    }
  });

  // 마무리 복습: 새 글자 + 이전 글자 섞어서 3개
  const all = [...prev, ...stage.newLetters];
  shuffle([...all]).slice(0, Math.min(3, all.length)).forEach(rl => {
    acts.push({ type: 'review', letter: rl });
  });

  return acts;
}

// ===================================================================
// 진도 저장 (localStorage)
// ===================================================================
const PROGRESS_KEY = 'hangul-progress-v1';

function loadProgress() {
  let p;
  try { p = JSON.parse(localStorage.getItem(PROGRESS_KEY)); } catch {}
  if (!p) p = {};
  p.letters = p.letters || {};
  p.stars = p.stars || 0;
  p.last = p.last || null;
  p.currentStage = p.currentStage || 1;
  p.completedStages = p.completedStages || [];
  p.stageProgress = p.stageProgress || null;  // { num, idx } 진행 중인 단계
  return p;
}

function setCurrentStage(num) {
  const p = loadProgress();
  p.currentStage = Math.min(TOTAL_STAGES, Math.max(1, num));
  saveProgress(p);
}

function markStageCompleted(num) {
  const p = loadProgress();
  if (!p.completedStages.includes(num)) p.completedStages.push(num);
  p.currentStage = Math.min(TOTAL_STAGES, num + 1);
  p.stageProgress = null;
  saveProgress(p);
}

function saveStageProgress(num, idx) {
  const p = loadProgress();
  p.stageProgress = { num, idx };
  saveProgress(p);
}

function clearStageProgress() {
  const p = loadProgress();
  p.stageProgress = null;
  saveProgress(p);
}

function saveProgress(p) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch {}
}

function markStageComplete(letter, stage) {
  const p = loadProgress();
  if (!p.letters[letter]) p.letters[letter] = { stages: [false, false, false], stars: 0 };
  const wasComplete = p.letters[letter].stages[stage - 1];
  p.letters[letter].stages[stage - 1] = true;
  if (!wasComplete) {
    p.letters[letter].stars = p.letters[letter].stages.filter(Boolean).length;
    p.stars = (p.stars || 0) + 1;
  }
  p.last = letter;
  saveProgress(p);
  return p;
}

function getLetterStars(letter) {
  const p = loadProgress();
  return p.letters[letter]?.stars || 0;
}

function isLetterComplete(letter) {
  return getLetterStars(letter) >= 3;
}

// ===================================================================
// TTS
// ===================================================================
let _audioWoken = false;

function wakeAudio() {
  if (_audioWoken || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0.01;
  u.lang = 'ko-KR';
  window.speechSynthesis.speak(u);
  _audioWoken = true;
}

function speak(text, opts = {}) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = opts.rate ?? 0.9;
  u.pitch = opts.pitch ?? 1.0;
  if (opts.onend) u.onend = opts.onend;
  window.speechSynthesis.speak(u);
}

// 첫 사용자 터치에 오디오 자동 활성화
document.addEventListener('touchstart', wakeAudio, { once: true });
document.addEventListener('mousedown', wakeAudio, { once: true });

// ===================================================================
// 단계 진행 엔진 (stage runner)
// ===================================================================
let _stage = null;  // { num, activities, idx }

function startStage(num, resumeIdx) {
  const acts = buildStageActivities(num);
  _stage = { num, activities: acts, idx: resumeIdx || 0 };
  saveStageProgress(num, _stage.idx);
  runCurrentActivity();
}

function runCurrentActivity() {
  if (!_stage) return;
  const app = document.getElementById('app');
  if (_stage.idx >= _stage.activities.length) {
    completeCurrentStage();
    return;
  }
  saveStageProgress(_stage.num, _stage.idx);
  const act = _stage.activities[_stage.idx];
  const data = getLetterData(act.letter);
  if (!data) { nextActivity(); return; }
  app.innerHTML = '';
  const opts = {
    inStage: true,
    stageNum: _stage.num,
    activityIdx: _stage.idx,
    totalActivities: _stage.activities.length,
    onNext: nextActivity,
    isReview: act.type === 'review'
  };
  if (act.type === 'trace') renderLearnStage2(app, data, opts);
  else if (act.type === 'recognize') renderLearnStage1(app, data, opts);
  else if (act.type === 'quiz' || act.type === 'review') renderLearnStage3(app, data, opts);
  else nextActivity();
}

function nextActivity() {
  if (!_stage) return;
  _stage.idx++;
  runCurrentActivity();
}

function completeCurrentStage() {
  const num = _stage ? _stage.num : null;
  _stage = null;
  if (num) {
    markStageCompleted(num);
    navigate('/stage-complete/' + num);
  } else {
    navigate('/home');
  }
}

function exitStage() {
  _stage = null;
  navigate('/home');
}

// ===================================================================
// 라우터
// ===================================================================
function navigate(path) { location.hash = '#' + path; }

function getRoute() {
  let hash = location.hash.replace(/^#/, '') || '/home';
  // Safari가 한국어를 자동으로 URL 인코딩하므로 디코딩 필요
  try { hash = decodeURIComponent(hash); } catch {}
  const parts = hash.split('/').filter(Boolean);
  return parts;  // 예: ['learn', 'ㄱ', '2']
}

function route() {
  const [view, ...params] = getRoute();
  const app = document.getElementById('app');
  app.innerHTML = '';
  // 단계 외부로 나가면 stage runner 중단
  if (view !== 'stage' && view !== 'stage-complete') _stage = null;
  switch (view) {
    case 'home':            return renderHome(app);
    case 'grid':            return renderGrid(app, params[0] || 'consonant');
    case 'learn':           return renderLearn(app, params[0], parseInt(params[1] || '1'));
    case 'reward':          return renderReward(app, params[0]);
    case 'stage':           return renderStageIntro(app, parseInt(params[0]));
    case 'stage-complete':  return renderStageComplete(app, parseInt(params[0]));
    default:                navigate('/home');
  }
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

// ===================================================================
// 뷰: 홈
// ===================================================================
function renderHome(app) {
  const p = loadProgress();
  const totalStars = p.stars || 0;
  const currentNum = Math.min(TOTAL_STAGES, p.currentStage);
  const allDone = p.completedStages.length >= TOTAL_STAGES;
  const stage = stageData(currentNum);
  const inProgress = p.stageProgress && p.stageProgress.num === currentNum;
  const newLettersStr = stage ? stage.newLetters.join(' ') : '';

  // 진행도 점 10개
  const dots = Array.from({length: TOTAL_STAGES}, (_, i) => {
    const n = i + 1;
    if (p.completedStages.includes(n)) return '<span class="s-dot s-done">✓</span>';
    if (n === currentNum && !allDone) return '<span class="s-dot s-now">' + n + '</span>';
    return '<span class="s-dot s-todo">' + n + '</span>';
  }).join('');

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="topbar">
      <div></div>
      <div class="stars-display">⭐ ${totalStars}</div>
    </div>
    <h1 class="home-greet">안녕! 오늘도 같이 놀자</h1>

    <div class="stage-progress">${dots}</div>

    ${allDone ? `
      <button class="today-card today-done" data-go="/stage/1">
        <div class="today-emoji">🏆</div>
        <div class="today-title">전부 다 배웠어요!</div>
        <div class="today-sub">처음부터 다시 해볼까?</div>
      </button>
    ` : `
      <button class="today-card" data-go="/stage/${currentNum}">
        <div class="today-emoji">🎯</div>
        <div class="today-stage-label">${currentNum}단계</div>
        <div class="today-title">${inProgress ? '이어서 하기' : '시작하기'}</div>
        <div class="today-sub">${newLettersStr}</div>
      </button>
    `}
  `;
  screen.querySelectorAll('[data-go]').forEach(b => {
    b.addEventListener('click', () => navigate(b.dataset.go));
  });
  app.appendChild(screen);
}

// ===================================================================
// 뷰: 자모 그리드
// ===================================================================
function renderGrid(app, type) {
  if (type !== 'consonant' && type !== 'vowel') {
    navigate('/home');
    return;
  }
  const list = type === 'vowel' ? VOWELS : CONSONANTS;
  const title = type === 'vowel' ? '모음을 배워볼까?' : '자음을 배워볼까?';
  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="topbar">
      <button class="back-btn" data-go="/home">← 홈</button>
      <div class="stars-display">⭐ ${loadProgress().stars || 0}</div>
    </div>
    <h2 class="grid-title">${title}</h2>
    <div class="letter-grid">
      ${list.map(c => {
        const stars = getLetterStars(c.letter);
        const complete = stars >= 3;
        return `
          <button class="letter-card ${complete ? 'complete' : ''}" data-letter="${c.letter}">
            <div class="letter-card-letter">${c.letter}</div>
            <div class="letter-card-emoji">${c.emoji}</div>
            <div class="letter-card-stars">${'⭐'.repeat(stars)}${'·'.repeat(3 - stars)}</div>
          </button>
        `;
      }).join('')}
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelectorAll('[data-letter]').forEach(b => b.addEventListener('click', () => {
    navigate('/learn/' + b.dataset.letter + '/1');
  }));
  app.appendChild(screen);
}

// ===================================================================
// 뷰: 학습 (1/2/3단계 디스패처)
// ===================================================================
function renderLearn(app, letter, stage) {
  const data = getLetterData(letter);
  if (!data) { navigate('/home'); return; }
  stage = Math.max(1, Math.min(3, stage));
  // 새 순서: 1=따라쓰기, 2=발음, 3=퀴즈
  if (stage === 1) renderLearnStage2(app, data);       // trace
  else if (stage === 2) renderLearnStage1(app, data);  // recognize
  else renderLearnStage3(app, data);                   // quiz
}

function makeLearnTopbar(data, step, opts) {
  const inStage = opts && opts.inStage;
  const backPath = inStage ? '/home' : '/grid/' + letterType(data.letter);
  const pct = inStage ? Math.round(((opts.activityIdx + 1) / opts.totalActivities) * 100) : 0;
  const middle = inStage
    ? `<div class="stage-bar"><div class="stage-bar-fill" style="width:${pct}%"></div><div class="stage-bar-label">${opts.activityIdx + 1} / ${opts.totalActivities}</div></div>`
    : `<div class="progress-dots">${[1,2,3].map(s => `<div class="progress-dot ${s===step?'active':s<step?'done':''}"></div>`).join('')}</div>`;
  return `
    <div class="topbar">
      <button class="back-btn" data-go="${backPath}">←</button>
      ${middle}
      <button class="home-btn" data-go="/home">🏠</button>
    </div>
  `;
}

// ===================================================================
// 학습 1단계: 보고 듣기
// ===================================================================
function renderLearnStage1(app, data, opts = {}) {
  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    ${makeLearnTopbar(data, 2, opts)}
    <div class="recognize-wrap">
      <div class="big-letter" id="big-letter">${data.letter}</div>
      <div class="letter-pronounce">${data.name}</div>
      <div class="assoc" id="assoc">
        <div class="assoc-emoji">${data.emoji}</div>
        <div>${data.word}</div>
      </div>
      <div class="row">
        <button class="replay-btn" id="replay-btn">🔊 다시 듣기</button>
        <button class="next-btn" id="next-btn">퀴즈 →</button>
      </div>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelector('#big-letter').addEventListener('click', () => speak(data.name));
  screen.querySelector('#assoc').addEventListener('click', () => speak(data.word));
  screen.querySelector('#replay-btn').addEventListener('click', () => playSequence(data));
  screen.querySelector('#next-btn').addEventListener('click', () => {
    markStageComplete(data.letter, 1);
    if (opts.onNext) opts.onNext();
    else navigate('/learn/' + data.letter + '/3');
  });
  app.appendChild(screen);

  // 자동 재생
  setTimeout(() => playSequence(data), 300);
}

function playSequence(data) {
  speak(data.name, { onend: () => setTimeout(() => speak(data.word), 400) });
}

// ===================================================================
// 학습 2단계: 따라쓰기 (체크포인트 시스템)
// ===================================================================
function renderLearnStage2(app, data, opts = {}) {
  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    ${makeLearnTopbar(data, 1, opts)}
    <div class="trace-wrap">
      <div class="trace-hint">이 모양을 손가락으로 따라 그려봐요</div>
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="guide-canvas"></canvas>
        <canvas id="user-canvas"></canvas>
      </div>
      <div class="trace-status pending" id="trace-status">주황색 점부터 순서대로 통과해 봐요</div>
      <div class="row">
        <button class="replay-btn" id="reset-btn">↻ 다시</button>
        <button class="next-btn" id="next-btn" style="display:none">발음 듣기 →</button>
      </div>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelector('#next-btn').addEventListener('click', () => {
    if (opts.onNext) opts.onNext();
    else navigate('/learn/' + data.letter + '/2');
  });
  app.appendChild(screen);

  initTracing(data, screen);
}

function initTracing(data, screen) {
  const guideCanvas = screen.querySelector('#guide-canvas');
  const userCanvas = screen.querySelector('#user-canvas');
  const wrap = screen.querySelector('#canvas-wrap');
  const status = screen.querySelector('#trace-status');
  const nextBtn = screen.querySelector('#next-btn');
  const resetBtn = screen.querySelector('#reset-btn');
  const guideCtx = guideCanvas.getContext('2d');
  const userCtx = userCanvas.getContext('2d');

  let waypoints = [];
  let currentWpIdx = 0;
  let allComplete = false;
  let isDrawing = false;
  let currentStroke = [];
  let userStrokes = [];
  let rafId = null;

  function getPointOnPath(stroke, t) {
    if (stroke.length === 1) return stroke[0];
    const segLens = [];
    let total = 0;
    for (let i = 1; i < stroke.length; i++) {
      const len = Math.hypot(stroke[i][0] - stroke[i-1][0], stroke[i][1] - stroke[i-1][1]);
      segLens.push(len);
      total += len;
    }
    if (total === 0) return stroke[0];
    let target = t * total, acc = 0;
    for (let i = 0; i < segLens.length; i++) {
      if (acc + segLens[i] >= target) {
        const localT = segLens[i] === 0 ? 0 : (target - acc) / segLens[i];
        return [
          stroke[i][0] + localT * (stroke[i+1][0] - stroke[i][0]),
          stroke[i][1] + localT * (stroke[i+1][1] - stroke[i][1])
        ];
      }
      acc += segLens[i];
    }
    return stroke[stroke.length - 1];
  }

  function rebuildWaypoints() {
    waypoints = [];
    currentWpIdx = 0;
    allComplete = false;
    const w = userCanvas.width / (window.devicePixelRatio || 1);
    const h = userCanvas.height / (window.devicePixelRatio || 1);
    if (w === 0 || h === 0) return;
    const spacing = Math.min(w, h) * 0.13;
    data.strokes.forEach((stroke, strokeIdx) => {
      let totalLen = 0;
      for (let i = 1; i < stroke.length; i++) {
        totalLen += Math.hypot(
          (stroke[i][0] - stroke[i-1][0]) * w,
          (stroke[i][1] - stroke[i-1][1]) * h
        );
      }
      const n = Math.max(3, Math.round(totalLen / spacing));
      for (let i = 0; i <= n; i++) {
        const [nx, ny] = getPointOnPath(stroke, i / n);
        waypoints.push({
          x: nx * w, y: ny * h, hit: false,
          strokeIdx, isFirst: i === 0, isLast: i === n
        });
      }
    });
  }

  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    [guideCanvas, userCanvas].forEach(c => {
      c.width = rect.width * dpr;
      c.height = rect.height * dpr;
      c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    rebuildWaypoints();
    drawGuide();
    redrawUser();
  }

  function drawGuide() {
    const w = guideCanvas.width / (window.devicePixelRatio || 1);
    const h = guideCanvas.height / (window.devicePixelRatio || 1);
    guideCtx.clearRect(0, 0, w, h);

    // 회색 가이드 라인
    guideCtx.strokeStyle = '#E5D5B7';
    guideCtx.lineWidth = Math.min(w, h) * 0.18;
    guideCtx.lineCap = 'round';
    guideCtx.lineJoin = 'round';
    data.strokes.forEach(stroke => {
      guideCtx.beginPath();
      stroke.forEach(([x, y], i) => {
        if (i === 0) guideCtx.moveTo(x * w, y * h);
        else guideCtx.lineTo(x * w, y * h);
      });
      guideCtx.stroke();
    });

    // 체크포인트
    if (waypoints.length === 0) return;
    const pulse = (Math.sin(Date.now() / 350) + 1) / 2;
    waypoints.forEach((wp, idx) => {
      const isActive = idx === currentWpIdx && !allComplete;
      if (wp.isFirst) {
        const r = w * 0.032;
        if (isActive) {
          guideCtx.fillStyle = `rgba(249,115,22,${0.25 + pulse * 0.25})`;
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, r * (1.8 + pulse * 0.3), 0, Math.PI * 2);
          guideCtx.fill();
        }
        guideCtx.fillStyle = wp.hit ? '#22C55E' : (isActive ? '#EA580C' : '#F97316');
        guideCtx.strokeStyle = 'white';
        guideCtx.lineWidth = w * 0.004;
        guideCtx.beginPath();
        guideCtx.arc(wp.x, wp.y, r, 0, Math.PI * 2);
        guideCtx.fill();
        guideCtx.stroke();
        guideCtx.fillStyle = 'white';
        guideCtx.font = `bold ${w * 0.038}px sans-serif`;
        guideCtx.textAlign = 'center';
        guideCtx.textBaseline = 'middle';
        guideCtx.fillText(wp.strokeIdx + 1, wp.x, wp.y);
      } else {
        const baseR = w * 0.013;
        if (isActive) {
          guideCtx.fillStyle = `rgba(249,115,22,${0.25 + pulse * 0.3})`;
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, baseR * (3.2 + pulse * 0.6), 0, Math.PI * 2);
          guideCtx.fill();
          guideCtx.fillStyle = 'white';
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, baseR * 2.2, 0, Math.PI * 2);
          guideCtx.fill();
          guideCtx.fillStyle = '#EA580C';
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, baseR * 1.8, 0, Math.PI * 2);
          guideCtx.fill();
        } else {
          guideCtx.fillStyle = wp.hit ? '#22C55E' : '#D97706';
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, baseR, 0, Math.PI * 2);
          guideCtx.fill();
        }
      }
    });
  }

  function redrawUser() {
    const w = userCanvas.width / (window.devicePixelRatio || 1);
    const h = userCanvas.height / (window.devicePixelRatio || 1);
    userCtx.clearRect(0, 0, w, h);
    userCtx.strokeStyle = '#3B82F6';
    userCtx.lineWidth = Math.min(w, h) * 0.14;
    userCtx.lineCap = 'round';
    userCtx.lineJoin = 'round';
    const all = [...userStrokes];
    if (currentStroke.length >= 2) all.push(currentStroke);
    all.forEach(s => {
      if (s.length < 2) return;
      userCtx.beginPath();
      s.forEach((p, i) => i === 0 ? userCtx.moveTo(p.x, p.y) : userCtx.lineTo(p.x, p.y));
      userCtx.stroke();
    });
  }

  function getPos(e) {
    const rect = userCanvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function checkHit(px, py) {
    if (allComplete || waypoints.length === 0) return;
    const w = userCanvas.width / (window.devicePixelRatio || 1);
    const hitR = Math.min(w, userCanvas.height / (window.devicePixelRatio || 1)) * 0.09;
    for (let k = 0; k < 3 && currentWpIdx + k < waypoints.length; k++) {
      const wp = waypoints[currentWpIdx + k];
      if (wp.hit) continue;
      if (Math.hypot(px - wp.x, py - wp.y) < hitR) {
        for (let j = 0; j <= k; j++) {
          if (waypoints[currentWpIdx + j]) waypoints[currentWpIdx + j].hit = true;
        }
        currentWpIdx += k + 1;
        if (currentWpIdx >= waypoints.length) onComplete();
        return;
      }
    }
  }

  function onComplete() {
    allComplete = true;
    status.classList.remove('pending');
    status.textContent = '✨ 잘 했어요!';
    speak('정말 잘 했어요');
    nextBtn.style.display = '';
    markStageComplete(data.letter, 2);
  }

  function startDraw(e) {
    e.preventDefault();
    isDrawing = true;
    const p = getPos(e);
    currentStroke = [p];
    checkHit(p.x, p.y);
  }
  function moveDraw(e) {
    e.preventDefault();
    if (!isDrawing) return;
    const p = getPos(e);
    currentStroke.push(p);
    checkHit(p.x, p.y);
    redrawUser();
  }
  function endDraw(e) {
    if (e.preventDefault) e.preventDefault();
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 1) userStrokes.push(currentStroke);
    currentStroke = [];
    redrawUser();
  }

  userCanvas.addEventListener('touchstart', startDraw, { passive: false });
  userCanvas.addEventListener('touchmove', moveDraw, { passive: false });
  userCanvas.addEventListener('touchend', endDraw, { passive: false });
  userCanvas.addEventListener('touchcancel', endDraw, { passive: false });
  userCanvas.addEventListener('mousedown', startDraw);
  userCanvas.addEventListener('mousemove', moveDraw);
  userCanvas.addEventListener('mouseup', endDraw);
  userCanvas.addEventListener('mouseleave', endDraw);

  resetBtn.addEventListener('click', () => {
    userStrokes = [];
    currentStroke = [];
    rebuildWaypoints();
    drawGuide();
    redrawUser();
    status.classList.add('pending');
    status.textContent = '손가락으로 따라 그려보세요';
    nextBtn.style.display = 'none';
  });

  // 따라쓰기 진입은 별 부여 안 함 (실제 완성 시 onComplete에서 부여)

  // 펄스 애니메이션
  function tick() {
    if (!allComplete && waypoints.length > 0 && currentWpIdx < waypoints.length) {
      drawGuide();
    }
    rafId = requestAnimationFrame(tick);
  }

  // 화면 떠날 때 정리
  const observer = new MutationObserver(() => {
    if (!document.contains(screen)) {
      if (rafId) cancelAnimationFrame(rafId);
      observer.disconnect();
    }
  });
  observer.observe(document.getElementById('app'), { childList: true });

  // 초기화 (캔버스가 레이아웃을 잡은 후)
  setTimeout(() => { resizeCanvas(); tick(); }, 50);
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
}

// ===================================================================
// 학습 3단계: 미니 퀴즈
// ===================================================================
function renderLearnStage3(app, data, opts = {}) {
  // 같은 set(자음 vs 모음) 내에서만 distractor 뽑기
  const sameSet = letterSet(data.letter);
  const others = sameSet.filter(c => c.letter !== data.letter);
  const distractors = shuffle(others).slice(0, 2);
  const choices = shuffle([data, ...distractors]);
  const isReview = opts.isReview;

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    ${makeLearnTopbar(data, 3, opts)}
    <div class="quiz-wrap">
      ${isReview ? `<div class="review-badge">🔄 복습</div>` : ''}
      <div class="quiz-prompt">🔊 <b>${data.name}</b> 은 어디에 있을까?</div>
      <div class="quiz-options">
        ${choices.map(c => `<button class="quiz-option" data-letter="${c.letter}">${c.letter}</button>`).join('')}
      </div>
      <button class="replay-btn" id="replay">🔊 다시 듣기</button>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelector('#replay').addEventListener('click', () => speak(data.name));
  screen.querySelectorAll('.quiz-option').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.letter === data.letter) {
        b.style.background = '#86EFAC';
        speak('잘 했어요');
        if (!isReview) markStageComplete(data.letter, 3);
        setTimeout(() => {
          if (opts.onNext) opts.onNext();
          else navigate('/reward/' + data.letter);
        }, 800);
      } else {
        b.classList.add('wrong');
        speak('다시 해볼까');
        setTimeout(() => b.classList.remove('wrong'), 500);
      }
    });
  });
  app.appendChild(screen);

  setTimeout(() => speak(data.name), 400);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===================================================================
// 뷰: 단계 인트로
// ===================================================================
function renderStageIntro(app, num) {
  const stage = stageData(num);
  if (!stage) { navigate('/home'); return; }
  const p = loadProgress();
  const resumeIdx = (p.stageProgress && p.stageProgress.num === num) ? p.stageProgress.idx : 0;
  const newEmojis = stage.newLetters.map(l => getLetterData(l)?.emoji || '').join(' ');

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="topbar">
      <button class="back-btn" data-go="/home">← 홈</button>
      <div class="stars-display">⭐ ${p.stars}</div>
    </div>
    <div class="stage-intro">
      <div class="stage-intro-num">${num}단계</div>
      <div class="stage-intro-title">${resumeIdx > 0 ? '이어서 할까요?' : '오늘 배울 글자'}</div>
      <div class="stage-intro-letters">${stage.newLetters.join('  ')}</div>
      <div class="stage-intro-emojis">${newEmojis}</div>
      <button class="big-start-btn" id="start-btn">${resumeIdx > 0 ? '이어서 하기 →' : '시작! →'}</button>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelector('#start-btn').addEventListener('click', () => {
    startStage(num, resumeIdx);
  });
  app.appendChild(screen);

  // 인트로 음성: "N단계, ㄱ과 ㅏ 배워요"
  setTimeout(() => {
    const names = stage.newLetters.map(l => getLetterData(l)?.name).filter(Boolean).join(', ');
    speak(`${num}단계. ${names}, 배워볼까요`);
  }, 400);
}

// ===================================================================
// 뷰: 단계 완료
// ===================================================================
function renderStageComplete(app, num) {
  const stage = stageData(num);
  if (!stage) { navigate('/home'); return; }
  const p = loadProgress();
  const nextNum = num + 1;
  const hasNext = nextNum <= TOTAL_STAGES;

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="topbar">
      <div></div>
      <div class="stars-display">⭐ ${p.stars}</div>
    </div>
    <div class="reward-wrap">
      <div class="reward-title">${num}단계 완료! 🎉</div>
      <div class="reward-stars">⭐ ⭐ ⭐</div>
      <div class="stage-done-letters">
        ${stage.newLetters.map(l => {
          const d = getLetterData(l);
          return `<div class="stage-done-card"><div class="L">${l}</div><div class="E">${d?.emoji||''}</div></div>`;
        }).join('')}
      </div>
      <div class="row">
        <button class="replay-btn" data-go="/home">🏠 홈으로</button>
        ${hasNext ? `<button class="next-btn" data-go="/stage/${nextNum}">다음 단계 →</button>` : ''}
      </div>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  app.appendChild(screen);

  setTimeout(() => speak(num === TOTAL_STAGES ? '모두 다 배웠어요. 정말 멋져요' : `${num}단계 완료. 정말 잘 했어요`), 400);
}

// ===================================================================
// 뷰: 보상
// ===================================================================
function renderReward(app, letter) {
  const data = getLetterData(letter);
  if (!data) { navigate('/home'); return; }
  const stars = getLetterStars(letter);

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="topbar">
      <div></div>
      <div class="stars-display">⭐ ${loadProgress().stars || 0}</div>
    </div>
    <div class="reward-wrap">
      <div class="reward-title">잘 했어요! 멋지다!</div>
      <div class="reward-stars">${'⭐'.repeat(stars)}</div>
      <div class="reward-letter-card">
        <div class="L">${data.letter}</div>
        <div>
          <div class="W">${data.word}</div>
          <div class="E">${data.emoji}</div>
        </div>
      </div>
      <div class="row">
        <button class="replay-btn" data-go="/home">🏠 홈으로</button>
        <button class="next-btn" id="next-letter">다음 글자 →</button>
      </div>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelector('#next-letter').addEventListener('click', () => {
    const list = letterSet(letter);
    const idx = list.findIndex(c => c.letter === letter);
    const next = list[(idx + 1) % list.length];
    navigate('/learn/' + next.letter + '/1');
  });
  app.appendChild(screen);

  setTimeout(() => speak('잘 했어요'), 400);
}
