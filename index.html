<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>한글 떼기</title>
<style>
:root {
  --bg: #FFF8E7;
  --card: #ffffff;
  --primary: #FBBF24;
  --primary-deep: #F59E0B;
  --accent: #F97316;
  --good: #22C55E;
  --text: #4a3a2a;
  --muted: #8a7a6a;
  --soft: #FDE68A;
  --gray: #E5D5B7;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  height: 100vh;
  overflow: hidden;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}
#app { height: 100vh; width: 100vw; display: flex; flex-direction: column; }

/* ============ 공통 ============ */
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 4px 12px;
  flex-shrink: 0;
}
.back-btn, .home-btn {
  font-size: 22px;
  font-weight: 700;
  padding: 10px 14px;
  min-width: 56px;
  min-height: 56px;
  border-radius: 14px;
  background: var(--soft);
  color: var(--text);
}
.back-btn:active, .home-btn:active { background: var(--primary); }
.stars-display {
  font-size: 22px;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 14px;
  background: var(--soft);
}

/* ============ 홈 ============ */
.home-greet {
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  margin: 12px 0 24px;
}
.home-cards {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 700px;
  width: 100%;
  margin: 0 auto;
  padding-bottom: 16px;
}
@media (orientation: landscape) and (min-width: 700px) {
  .home-cards { flex-direction: row; align-items: stretch; }
}
.home-card {
  flex: 1;
  background: var(--card);
  border-radius: 28px;
  padding: 24px;
  text-align: center;
  box-shadow: 0 6px 16px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  transition: transform 0.1s;
}
.home-card:active { transform: scale(0.97); }
.home-card.disabled {
  opacity: 0.5;
}
.home-card-emoji { font-size: 72px; line-height: 1; }
.home-card-title {
  font-size: 32px;
  font-weight: 800;
  margin-top: 12px;
}
.home-card-sub {
  font-size: 18px;
  color: var(--muted);
  margin-top: 6px;
}
.continue-btn {
  margin: 16px auto 0;
  background: var(--accent);
  color: white;
  font-size: 20px;
  font-weight: 700;
  padding: 14px 28px;
  border-radius: 20px;
  box-shadow: 0 4px 12px rgba(249,115,22,0.3);
}

/* ============ 그리드 ============ */
.grid-title {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 18px;
}
.letter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}
@media (min-width: 600px) {
  .letter-grid { grid-template-columns: repeat(5, 1fr); }
}
@media (min-width: 900px) {
  .letter-grid { grid-template-columns: repeat(7, 1fr); }
}
.letter-card {
  background: var(--card);
  border-radius: 20px;
  padding: 12px 8px 8px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 110px;
  transition: transform 0.1s;
  border: 3px solid transparent;
}
.letter-card:active { transform: scale(0.95); }
.letter-card.complete { border-color: var(--good); }
.letter-card-letter {
  font-size: 38px;
  font-weight: 800;
  line-height: 1;
}
.letter-card-emoji { font-size: 22px; margin-top: 4px; }
.letter-card-stars {
  font-size: 13px;
  color: var(--primary-deep);
  letter-spacing: 1px;
  margin-top: 4px;
  min-height: 16px;
}

/* ============ 학습 공통 ============ */
.progress-dots {
  display: flex;
  gap: 8px;
  align-items: center;
}
.progress-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--gray);
}
.progress-dot.active { background: var(--accent); }
.progress-dot.done { background: var(--good); }

/* ============ 1단계: 보고 듣기 ============ */
.recognize-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-around;
  padding: 12px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
}
.big-letter {
  font-size: clamp(200px, 50vmin, 360px);
  font-weight: 800;
  line-height: 0.9;
  color: var(--text);
  background: var(--card);
  border-radius: 32px;
  padding: 24px 48px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.06);
  cursor: pointer;
}
.big-letter:active { background: var(--soft); }
.letter-pronounce {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary-deep);
  margin: 8px 0;
}
.assoc {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border-radius: 20px;
  padding: 12px 20px;
  font-size: 24px;
  font-weight: 700;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  cursor: pointer;
}
.assoc-emoji { font-size: 40px; }
.next-btn, .replay-btn {
  font-size: 22px;
  font-weight: 700;
  padding: 16px 28px;
  border-radius: 20px;
  min-height: 60px;
}
.next-btn {
  background: var(--accent);
  color: white;
  box-shadow: 0 4px 12px rgba(249,115,22,0.3);
}
.replay-btn { background: var(--soft); }
.row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ============ 2단계: 따라쓰기 ============ */
.trace-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 8px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
}
.trace-hint {
  font-size: 18px;
  color: var(--muted);
  text-align: center;
}
.trace-status {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  min-height: 32px;
  color: var(--good);
}
.trace-status.pending { color: var(--muted); }
.canvas-wrap {
  position: relative;
  width: min(85vw, 60vh, 480px);
  aspect-ratio: 1 / 1;
  background: #FFFBEB;
  border: 3px dashed var(--primary);
  border-radius: 24px;
  overflow: hidden;
  touch-action: none;
}
.canvas-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.canvas-wrap #guide-canvas { z-index: 1; }
.canvas-wrap #user-canvas { z-index: 2; }
.canvas-wrap, .canvas-wrap * {
  touch-action: none !important;
}

/* ============ 3단계: 퀴즈 ============ */
.quiz-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 12px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
}
.quiz-prompt {
  font-size: 26px;
  font-weight: 700;
  text-align: center;
}
.quiz-prompt b {
  font-size: 36px;
  color: var(--accent);
}
.quiz-options {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}
.quiz-option {
  background: var(--card);
  border-radius: 24px;
  padding: 24px 8px;
  width: clamp(100px, 28vw, 140px);
  height: clamp(100px, 28vw, 140px);
  font-size: clamp(60px, 16vw, 92px);
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  transition: transform 0.1s;
  border: 3px solid transparent;
}
.quiz-option:active { transform: scale(0.95); }
.quiz-option.wrong {
  animation: shake 0.4s;
  border-color: #FCA5A5;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

/* ============ 보상 ============ */
.reward-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px;
  text-align: center;
}
.reward-title {
  font-size: 36px;
  font-weight: 800;
  color: var(--accent);
}
.reward-stars {
  font-size: 80px;
  letter-spacing: 8px;
  animation: pop 0.6s ease-out;
}
@keyframes pop {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); }
}
.reward-letter-card {
  background: var(--card);
  border-radius: 24px;
  padding: 20px 32px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.06);
  display: flex;
  align-items: center;
  gap: 16px;
}
.reward-letter-card .L { font-size: 80px; font-weight: 800; }
.reward-letter-card .W { font-size: 24px; font-weight: 700; }
.reward-letter-card .E { font-size: 60px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

// ===================================================================
// 데이터: 자음 14자
// ===================================================================
const CONSONANTS = [
  { letter: 'ㄱ', name: '기역', word: '기차', emoji: '🚂',
    strokes: [ [[0.22, 0.28], [0.78, 0.28], [0.78, 0.78]] ] },
  { letter: 'ㄴ', name: '니은', word: '나비', emoji: '🦋',
    strokes: [ [[0.25, 0.22], [0.25, 0.75], [0.78, 0.75]] ] },
  { letter: 'ㄷ', name: '디귿', word: '도넛', emoji: '🍩',
    strokes: [
      [[0.22, 0.25], [0.78, 0.25]],
      [[0.25, 0.25], [0.25, 0.75], [0.78, 0.75]]
    ] },
  { letter: 'ㄹ', name: '리을', word: '라면', emoji: '🍜',
    strokes: [
      [[0.22, 0.22], [0.78, 0.22], [0.78, 0.45]],
      [[0.22, 0.45], [0.78, 0.45]],
      [[0.22, 0.45], [0.22, 0.78], [0.78, 0.78]]
    ] },
  { letter: 'ㅁ', name: '미음', word: '모자', emoji: '🎩',
    strokes: [
      [[0.25, 0.25], [0.25, 0.78]],
      [[0.25, 0.25], [0.75, 0.25], [0.75, 0.78]],
      [[0.25, 0.78], [0.75, 0.78]]
    ] },
  { letter: 'ㅂ', name: '비읍', word: '바나나', emoji: '🍌',
    strokes: [
      [[0.25, 0.2], [0.25, 0.8]],
      [[0.75, 0.25], [0.75, 0.8]],
      [[0.25, 0.5], [0.75, 0.5]],
      [[0.25, 0.8], [0.75, 0.8]]
    ] },
  { letter: 'ㅅ', name: '시옷', word: '사과', emoji: '🍎',
    strokes: [
      [[0.5, 0.22], [0.2, 0.8]],
      [[0.5, 0.45], [0.8, 0.8]]
    ] },
  { letter: 'ㅇ', name: '이응', word: '오리', emoji: '🦆',
    strokes: [
      [[0.5, 0.2], [0.72, 0.28], [0.8, 0.5], [0.72, 0.72], [0.5, 0.8], [0.28, 0.72], [0.2, 0.5], [0.28, 0.28], [0.5, 0.2]]
    ] },
  { letter: 'ㅈ', name: '지읒', word: '자전거', emoji: '🚲',
    strokes: [
      [[0.22, 0.3], [0.78, 0.3]],
      [[0.5, 0.3], [0.25, 0.78]],
      [[0.5, 0.5], [0.78, 0.78]]
    ] },
  { letter: 'ㅊ', name: '치읓', word: '치즈', emoji: '🧀',
    strokes: [
      [[0.42, 0.15], [0.58, 0.25]],
      [[0.2, 0.4], [0.8, 0.4]],
      [[0.5, 0.4], [0.25, 0.8]],
      [[0.5, 0.6], [0.78, 0.8]]
    ] },
  { letter: 'ㅋ', name: '키읔', word: '코끼리', emoji: '🐘',
    strokes: [
      [[0.22, 0.25], [0.78, 0.25], [0.78, 0.78]],
      [[0.22, 0.52], [0.72, 0.52]]
    ] },
  { letter: 'ㅌ', name: '티읕', word: '토끼', emoji: '🐰',
    strokes: [
      [[0.22, 0.25], [0.78, 0.25]],
      [[0.25, 0.5], [0.75, 0.5]],
      [[0.25, 0.25], [0.25, 0.78], [0.78, 0.78]]
    ] },
  { letter: 'ㅍ', name: '피읖', word: '포도', emoji: '🍇',
    strokes: [
      [[0.2, 0.3], [0.8, 0.3]],
      [[0.35, 0.3], [0.35, 0.75]],
      [[0.65, 0.3], [0.65, 0.75]],
      [[0.2, 0.75], [0.8, 0.75]]
    ] },
  { letter: 'ㅎ', name: '히읗', word: '호랑이', emoji: '🐯',
    strokes: [
      [[0.42, 0.12], [0.58, 0.22]],
      [[0.2, 0.35], [0.8, 0.35]],
      [[0.5, 0.5], [0.65, 0.55], [0.72, 0.65], [0.65, 0.75], [0.5, 0.8], [0.35, 0.75], [0.28, 0.65], [0.35, 0.55], [0.5, 0.5]]
    ] }
];

function getLetterData(letter) {
  return CONSONANTS.find(c => c.letter === letter);
}

// ===================================================================
// 진도 저장 (localStorage)
// ===================================================================
const PROGRESS_KEY = 'hangul-progress-v1';

function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || { letters: {}, stars: 0, last: null };
  } catch {
    return { letters: {}, stars: 0, last: null };
  }
}

function saveProgress(p) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch {}
}

function markStageComplete(letter, stage) {
  const p = loadProgress();
  if (!p.letters[letter]) p.letters[letter] = { stages: [false, false, false], stars: 0 };
  const wasComplete = p.letters[letter].stages[stage - 1];
  p.letters[letter].stages[stage - 1] = true;
  if (!wasComplete) {
    p.letters[letter].stars = p.letters[letter].stages.filter(Boolean).length;
    p.stars = (p.stars || 0) + 1;
  }
  p.last = letter;
  saveProgress(p);
  return p;
}

function getLetterStars(letter) {
  const p = loadProgress();
  return p.letters[letter]?.stars || 0;
}

function isLetterComplete(letter) {
  return getLetterStars(letter) >= 3;
}

// ===================================================================
// TTS
// ===================================================================
let _audioWoken = false;

function wakeAudio() {
  if (_audioWoken || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0.01;
  u.lang = 'ko-KR';
  window.speechSynthesis.speak(u);
  _audioWoken = true;
}

function speak(text, opts = {}) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = opts.rate ?? 0.9;
  u.pitch = opts.pitch ?? 1.0;
  if (opts.onend) u.onend = opts.onend;
  window.speechSynthesis.speak(u);
}

// 첫 사용자 터치에 오디오 자동 활성화
document.addEventListener('touchstart', wakeAudio, { once: true });
document.addEventListener('mousedown', wakeAudio, { once: true });

// ===================================================================
// 라우터
// ===================================================================
function navigate(path) { location.hash = '#' + path; }

function getRoute() {
  const hash = location.hash.replace(/^#/, '') || '/home';
  const parts = hash.split('/').filter(Boolean);
  return parts;  // 예: ['learn', 'ㄱ', '2']
}

function route() {
  const [view, ...params] = getRoute();
  const app = document.getElementById('app');
  app.innerHTML = '';
  switch (view) {
    case 'home':       return renderHome(app);
    case 'grid':       return renderGrid(app, params[0] || 'consonant');
    case 'learn':      return renderLearn(app, params[0], parseInt(params[1] || '1'));
    case 'reward':     return renderReward(app, params[0]);
    default:           navigate('/home');
  }
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

// ===================================================================
// 뷰: 홈
// ===================================================================
function renderHome(app) {
  const p = loadProgress();
  const totalStars = p.stars || 0;
  const lastLetter = p.last;
  const lastData = lastLetter ? getLetterData(lastLetter) : null;

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="topbar">
      <div></div>
      <div class="stars-display">⭐ ${totalStars}</div>
    </div>
    <h1 class="home-greet">안녕! 오늘도 같이 놀자</h1>
    <div class="home-cards">
      <button class="home-card" data-go="/grid/consonant">
        <div class="home-card-emoji">🐯</div>
        <div class="home-card-title">자음 배우기</div>
        <div class="home-card-sub">ㄱ ㄴ ㄷ ㄹ …</div>
      </button>
      <button class="home-card disabled" data-go="/grid/vowel">
        <div class="home-card-emoji">🦋</div>
        <div class="home-card-title">모음 배우기</div>
        <div class="home-card-sub">곧 추가될 예정 🌱</div>
      </button>
    </div>
    ${lastData ? `<button class="continue-btn" data-go="/learn/${lastLetter}/1">🎁 이어서 하기 (${lastData.letter})</button>` : ''}
  `;
  screen.querySelectorAll('[data-go]').forEach(b => {
    if (b.classList.contains('disabled')) {
      b.addEventListener('click', () => speak('모음은 곧 추가될 예정이에요'));
    } else {
      b.addEventListener('click', () => navigate(b.dataset.go));
    }
  });
  app.appendChild(screen);
}

// ===================================================================
// 뷰: 자모 그리드
// ===================================================================
function renderGrid(app, type) {
  if (type !== 'consonant') {
    navigate('/home');
    return;
  }
  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="topbar">
      <button class="back-btn" data-go="/home">← 홈</button>
      <div class="stars-display">⭐ ${loadProgress().stars || 0}</div>
    </div>
    <h2 class="grid-title">어떤 글자를 배워볼까?</h2>
    <div class="letter-grid">
      ${CONSONANTS.map(c => {
        const stars = getLetterStars(c.letter);
        const complete = stars >= 3;
        return `
          <button class="letter-card ${complete ? 'complete' : ''}" data-letter="${c.letter}">
            <div class="letter-card-letter">${c.letter}</div>
            <div class="letter-card-emoji">${c.emoji}</div>
            <div class="letter-card-stars">${'⭐'.repeat(stars)}${'·'.repeat(3 - stars)}</div>
          </button>
        `;
      }).join('')}
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelectorAll('[data-letter]').forEach(b => b.addEventListener('click', () => {
    navigate('/learn/' + b.dataset.letter + '/1');
  }));
  app.appendChild(screen);
}

// ===================================================================
// 뷰: 학습 (1/2/3단계 디스패처)
// ===================================================================
function renderLearn(app, letter, stage) {
  const data = getLetterData(letter);
  if (!data) { navigate('/home'); return; }
  stage = Math.max(1, Math.min(3, stage));

  if (stage === 1) renderLearnStage1(app, data);
  else if (stage === 2) renderLearnStage2(app, data);
  else renderLearnStage3(app, data);
}

function makeLearnTopbar(data, stage) {
  return `
    <div class="topbar">
      <button class="back-btn" data-go="/grid/consonant">←</button>
      <div class="progress-dots">
        ${[1,2,3].map(s => `<div class="progress-dot ${s===stage?'active':s<stage?'done':''}"></div>`).join('')}
      </div>
      <button class="home-btn" data-go="/home">🏠</button>
    </div>
  `;
}

// ===================================================================
// 학습 1단계: 보고 듣기
// ===================================================================
function renderLearnStage1(app, data) {
  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    ${makeLearnTopbar(data, 1)}
    <div class="recognize-wrap">
      <div class="big-letter" id="big-letter">${data.letter}</div>
      <div class="letter-pronounce">${data.name}</div>
      <div class="assoc" id="assoc">
        <div class="assoc-emoji">${data.emoji}</div>
        <div>${data.word}</div>
      </div>
      <div class="row">
        <button class="replay-btn" id="replay-btn">🔊 다시 듣기</button>
        <button class="next-btn" data-go="/learn/${data.letter}/2">따라쓰기 →</button>
      </div>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelector('#big-letter').addEventListener('click', () => speak(data.name));
  screen.querySelector('#assoc').addEventListener('click', () => speak(data.word));
  screen.querySelector('#replay-btn').addEventListener('click', () => playSequence(data));
  app.appendChild(screen);

  // 자동 재생
  setTimeout(() => playSequence(data), 300);
}

function playSequence(data) {
  speak(data.name, { onend: () => setTimeout(() => speak(data.word), 400) });
}

// ===================================================================
// 학습 2단계: 따라쓰기 (체크포인트 시스템)
// ===================================================================
function renderLearnStage2(app, data) {
  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    ${makeLearnTopbar(data, 2)}
    <div class="trace-wrap">
      <div class="trace-hint">주황색 점부터 순서대로 따라 그려요</div>
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="guide-canvas"></canvas>
        <canvas id="user-canvas"></canvas>
      </div>
      <div class="trace-status pending" id="trace-status">손가락으로 따라 그려보세요</div>
      <div class="row">
        <button class="replay-btn" id="reset-btn">↻ 다시</button>
        <button class="next-btn" id="next-btn" style="display:none" data-go="/learn/${data.letter}/3">퀴즈로 →</button>
      </div>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  app.appendChild(screen);

  initTracing(data, screen);
}

function initTracing(data, screen) {
  const guideCanvas = screen.querySelector('#guide-canvas');
  const userCanvas = screen.querySelector('#user-canvas');
  const wrap = screen.querySelector('#canvas-wrap');
  const status = screen.querySelector('#trace-status');
  const nextBtn = screen.querySelector('#next-btn');
  const resetBtn = screen.querySelector('#reset-btn');
  const guideCtx = guideCanvas.getContext('2d');
  const userCtx = userCanvas.getContext('2d');

  let waypoints = [];
  let currentWpIdx = 0;
  let allComplete = false;
  let isDrawing = false;
  let currentStroke = [];
  let userStrokes = [];
  let rafId = null;

  function getPointOnPath(stroke, t) {
    if (stroke.length === 1) return stroke[0];
    const segLens = [];
    let total = 0;
    for (let i = 1; i < stroke.length; i++) {
      const len = Math.hypot(stroke[i][0] - stroke[i-1][0], stroke[i][1] - stroke[i-1][1]);
      segLens.push(len);
      total += len;
    }
    if (total === 0) return stroke[0];
    let target = t * total, acc = 0;
    for (let i = 0; i < segLens.length; i++) {
      if (acc + segLens[i] >= target) {
        const localT = segLens[i] === 0 ? 0 : (target - acc) / segLens[i];
        return [
          stroke[i][0] + localT * (stroke[i+1][0] - stroke[i][0]),
          stroke[i][1] + localT * (stroke[i+1][1] - stroke[i][1])
        ];
      }
      acc += segLens[i];
    }
    return stroke[stroke.length - 1];
  }

  function rebuildWaypoints() {
    waypoints = [];
    currentWpIdx = 0;
    allComplete = false;
    const w = userCanvas.width / (window.devicePixelRatio || 1);
    const h = userCanvas.height / (window.devicePixelRatio || 1);
    if (w === 0 || h === 0) return;
    const spacing = Math.min(w, h) * 0.13;
    data.strokes.forEach((stroke, strokeIdx) => {
      let totalLen = 0;
      for (let i = 1; i < stroke.length; i++) {
        totalLen += Math.hypot(
          (stroke[i][0] - stroke[i-1][0]) * w,
          (stroke[i][1] - stroke[i-1][1]) * h
        );
      }
      const n = Math.max(3, Math.round(totalLen / spacing));
      for (let i = 0; i <= n; i++) {
        const [nx, ny] = getPointOnPath(stroke, i / n);
        waypoints.push({
          x: nx * w, y: ny * h, hit: false,
          strokeIdx, isFirst: i === 0, isLast: i === n
        });
      }
    });
  }

  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    [guideCanvas, userCanvas].forEach(c => {
      c.width = rect.width * dpr;
      c.height = rect.height * dpr;
      c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    rebuildWaypoints();
    drawGuide();
    redrawUser();
  }

  function drawGuide() {
    const w = guideCanvas.width / (window.devicePixelRatio || 1);
    const h = guideCanvas.height / (window.devicePixelRatio || 1);
    guideCtx.clearRect(0, 0, w, h);

    // 회색 가이드 라인
    guideCtx.strokeStyle = '#E5D5B7';
    guideCtx.lineWidth = Math.min(w, h) * 0.18;
    guideCtx.lineCap = 'round';
    guideCtx.lineJoin = 'round';
    data.strokes.forEach(stroke => {
      guideCtx.beginPath();
      stroke.forEach(([x, y], i) => {
        if (i === 0) guideCtx.moveTo(x * w, y * h);
        else guideCtx.lineTo(x * w, y * h);
      });
      guideCtx.stroke();
    });

    // 체크포인트
    if (waypoints.length === 0) return;
    const pulse = (Math.sin(Date.now() / 350) + 1) / 2;
    waypoints.forEach((wp, idx) => {
      const isActive = idx === currentWpIdx && !allComplete;
      if (wp.isFirst) {
        const r = w * 0.032;
        if (isActive) {
          guideCtx.fillStyle = `rgba(249,115,22,${0.25 + pulse * 0.25})`;
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, r * (1.8 + pulse * 0.3), 0, Math.PI * 2);
          guideCtx.fill();
        }
        guideCtx.fillStyle = wp.hit ? '#22C55E' : (isActive ? '#EA580C' : '#F97316');
        guideCtx.strokeStyle = 'white';
        guideCtx.lineWidth = w * 0.004;
        guideCtx.beginPath();
        guideCtx.arc(wp.x, wp.y, r, 0, Math.PI * 2);
        guideCtx.fill();
        guideCtx.stroke();
        guideCtx.fillStyle = 'white';
        guideCtx.font = `bold ${w * 0.038}px sans-serif`;
        guideCtx.textAlign = 'center';
        guideCtx.textBaseline = 'middle';
        guideCtx.fillText(wp.strokeIdx + 1, wp.x, wp.y);
      } else {
        const baseR = w * 0.013;
        if (isActive) {
          guideCtx.fillStyle = `rgba(249,115,22,${0.25 + pulse * 0.3})`;
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, baseR * (3.2 + pulse * 0.6), 0, Math.PI * 2);
          guideCtx.fill();
          guideCtx.fillStyle = 'white';
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, baseR * 2.2, 0, Math.PI * 2);
          guideCtx.fill();
          guideCtx.fillStyle = '#EA580C';
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, baseR * 1.8, 0, Math.PI * 2);
          guideCtx.fill();
        } else {
          guideCtx.fillStyle = wp.hit ? '#22C55E' : '#D97706';
          guideCtx.beginPath();
          guideCtx.arc(wp.x, wp.y, baseR, 0, Math.PI * 2);
          guideCtx.fill();
        }
      }
    });
  }

  function redrawUser() {
    const w = userCanvas.width / (window.devicePixelRatio || 1);
    const h = userCanvas.height / (window.devicePixelRatio || 1);
    userCtx.clearRect(0, 0, w, h);
    userCtx.strokeStyle = '#3B82F6';
    userCtx.lineWidth = Math.min(w, h) * 0.14;
    userCtx.lineCap = 'round';
    userCtx.lineJoin = 'round';
    const all = [...userStrokes];
    if (currentStroke.length >= 2) all.push(currentStroke);
    all.forEach(s => {
      if (s.length < 2) return;
      userCtx.beginPath();
      s.forEach((p, i) => i === 0 ? userCtx.moveTo(p.x, p.y) : userCtx.lineTo(p.x, p.y));
      userCtx.stroke();
    });
  }

  function getPos(e) {
    const rect = userCanvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function checkHit(px, py) {
    if (allComplete || waypoints.length === 0) return;
    const w = userCanvas.width / (window.devicePixelRatio || 1);
    const hitR = Math.min(w, userCanvas.height / (window.devicePixelRatio || 1)) * 0.09;
    for (let k = 0; k < 3 && currentWpIdx + k < waypoints.length; k++) {
      const wp = waypoints[currentWpIdx + k];
      if (wp.hit) continue;
      if (Math.hypot(px - wp.x, py - wp.y) < hitR) {
        for (let j = 0; j <= k; j++) {
          if (waypoints[currentWpIdx + j]) waypoints[currentWpIdx + j].hit = true;
        }
        currentWpIdx += k + 1;
        if (currentWpIdx >= waypoints.length) onComplete();
        return;
      }
    }
  }

  function onComplete() {
    allComplete = true;
    status.classList.remove('pending');
    status.textContent = '✨ 잘 했어요!';
    speak('정말 잘 했어요');
    nextBtn.style.display = '';
    markStageComplete(data.letter, 2);
  }

  function startDraw(e) {
    e.preventDefault();
    isDrawing = true;
    const p = getPos(e);
    currentStroke = [p];
    checkHit(p.x, p.y);
  }
  function moveDraw(e) {
    e.preventDefault();
    if (!isDrawing) return;
    const p = getPos(e);
    currentStroke.push(p);
    checkHit(p.x, p.y);
    redrawUser();
  }
  function endDraw(e) {
    if (e.preventDefault) e.preventDefault();
    if (!isDrawing) return;
    isDrawing = false;
    if (currentStroke.length > 1) userStrokes.push(currentStroke);
    currentStroke = [];
    redrawUser();
  }

  userCanvas.addEventListener('touchstart', startDraw, { passive: false });
  userCanvas.addEventListener('touchmove', moveDraw, { passive: false });
  userCanvas.addEventListener('touchend', endDraw, { passive: false });
  userCanvas.addEventListener('touchcancel', endDraw, { passive: false });
  userCanvas.addEventListener('mousedown', startDraw);
  userCanvas.addEventListener('mousemove', moveDraw);
  userCanvas.addEventListener('mouseup', endDraw);
  userCanvas.addEventListener('mouseleave', endDraw);

  resetBtn.addEventListener('click', () => {
    userStrokes = [];
    currentStroke = [];
    rebuildWaypoints();
    drawGuide();
    redrawUser();
    status.classList.add('pending');
    status.textContent = '손가락으로 따라 그려보세요';
    nextBtn.style.display = 'none';
  });

  // 학습 1단계 완료로 인정 (들어왔으니)
  markStageComplete(data.letter, 1);

  // 펄스 애니메이션
  function tick() {
    if (!allComplete && waypoints.length > 0 && currentWpIdx < waypoints.length) {
      drawGuide();
    }
    rafId = requestAnimationFrame(tick);
  }

  // 화면 떠날 때 정리
  const observer = new MutationObserver(() => {
    if (!document.contains(screen)) {
      if (rafId) cancelAnimationFrame(rafId);
      observer.disconnect();
    }
  });
  observer.observe(document.getElementById('app'), { childList: true });

  // 초기화 (캔버스가 레이아웃을 잡은 후)
  setTimeout(() => { resizeCanvas(); tick(); }, 50);
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
}

// ===================================================================
// 학습 3단계: 미니 퀴즈
// ===================================================================
function renderLearnStage3(app, data) {
  // 같은 글자 + 다른 2~3개 자음을 랜덤 distractor로
  const others = CONSONANTS.filter(c => c.letter !== data.letter);
  const distractors = shuffle(others).slice(0, 2);
  const choices = shuffle([data, ...distractors]);

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    ${makeLearnTopbar(data, 3)}
    <div class="quiz-wrap">
      <div class="quiz-prompt">🔊 <b>${data.name}</b> 은 어디에 있을까?</div>
      <div class="quiz-options">
        ${choices.map(c => `<button class="quiz-option" data-letter="${c.letter}">${c.letter}</button>`).join('')}
      </div>
      <button class="replay-btn" id="replay">🔊 다시 듣기</button>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelector('#replay').addEventListener('click', () => speak(data.name));
  screen.querySelectorAll('.quiz-option').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.letter === data.letter) {
        b.style.background = '#86EFAC';
        speak('잘 했어요');
        markStageComplete(data.letter, 3);
        setTimeout(() => navigate('/reward/' + data.letter), 800);
      } else {
        b.classList.add('wrong');
        speak('다시 해볼까');
        setTimeout(() => b.classList.remove('wrong'), 500);
      }
    });
  });
  app.appendChild(screen);

  setTimeout(() => speak(data.name), 400);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===================================================================
// 뷰: 보상
// ===================================================================
function renderReward(app, letter) {
  const data = getLetterData(letter);
  if (!data) { navigate('/home'); return; }
  const stars = getLetterStars(letter);

  const screen = document.createElement('div');
  screen.className = 'screen';
  screen.innerHTML = `
    <div class="topbar">
      <div></div>
      <div class="stars-display">⭐ ${loadProgress().stars || 0}</div>
    </div>
    <div class="reward-wrap">
      <div class="reward-title">잘 했어요! 멋지다!</div>
      <div class="reward-stars">${'⭐'.repeat(stars)}</div>
      <div class="reward-letter-card">
        <div class="L">${data.letter}</div>
        <div>
          <div class="W">${data.word}</div>
          <div class="E">${data.emoji}</div>
        </div>
      </div>
      <div class="row">
        <button class="replay-btn" data-go="/home">🏠 홈으로</button>
        <button class="next-btn" id="next-letter">다음 글자 →</button>
      </div>
    </div>
  `;
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  screen.querySelector('#next-letter').addEventListener('click', () => {
    const idx = CONSONANTS.findIndex(c => c.letter === letter);
    const next = CONSONANTS[(idx + 1) % CONSONANTS.length];
    navigate('/learn/' + next.letter + '/1');
  });
  app.appendChild(screen);

  setTimeout(() => speak('잘 했어요'), 400);
}
